; dk2hires.ini - Einstellungen fuer den DK2-Hochaufloesungs-Fix (liegt neben DKII-DX.exe)
; Fehlt die Datei, gelten dieselben Standardwerte, nur MonitorSec ist dann 60.

[fix]
; Cursor size in percent (25..200); 100 = original. Restart the game.
CursorScale=100
; Kacheltabelle der Textpanels auslagern (behebt Absturz und fehlende Menuetexte)
TileFix=1
; Mindestgroesse des Engine-Heaps; 0 = automatisch aus der Aufloesung
HeapFix=1
EngineHeapMB=0
; Kamera: Bild wie bei 1024x768, breitere Formate zeigen seitlich mehr (Hor+)
CameraFix=1
CameraRefHeight=768
; Ingame-Schriften ab Bildhoehe > FontRefHeight vergroessern (Faktor Hoehe/FontRefHeight), 0 = aus
FontRefHeight=1080
; Unteres Ingame-HUD in Prozent (50..100), unten links; 100 = Original
; Wirkt nur oberhalb von 768 Bildzeilen. Nach Aenderungen Spiel neu starten.
MenuScale=75
; Mausrad: vorwaerts = hineinzoomen, rueckwaerts = herauszoomen (0 = aus)
MouseWheelZoom=1
; Mittlere Maustaste halten und Maus bewegen = Kamera drehen (X), 0 = aus
MiddleMouseRotate=1
; Drehgeschwindigkeit in Prozent: 1..200, 50 = halb, 100 = Original
MiddleMouseRotateSpeed=25
; Horizontale Drehrichtung umkehren: 0 = normal, 1 = invertiert
MiddleMouseRotateInvert=0
; Vertikale MMB-Bewegung = direkte Kameraneigung, 0 = aus
MiddleMousePitch=1
; Zusaetzlicher Neigungsfaktor in Prozent (1..200)
MiddleMousePitchSpeed=200
MiddleMousePitchInvert=0
; Dauer des Zoom-Impulses pro Rastung (20..250 ms); hoeher = schneller
WheelZoomMs=80
; Richtung des Mausrads umkehren (0 = normal, 1 = invertiert)
WheelZoomInvert=0
; Widescreen minimap frame correction when MenuScale is below 100.
; 1 = enlarge minimap independently of other HUD icons; 0 = previous layout.
MinimapAspectFix=1

[log]
; alle N Sekunden Heap/Speicher nach dk2hires.log schreiben (0 = aus)
MonitorSec=0
